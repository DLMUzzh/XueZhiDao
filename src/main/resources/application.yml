spring:
  application:
    name: zhiguang-auth
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/zhicheng?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 6000000
      max-lifetime: 17000000
      keepalive-time: 300000
      connection-timeout: 30000
  jackson:
    serialization:
      write-dates-as-timestamps: false
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  kafka:
    bootstrap-servers: 127.0.0.1:9092
    template:
      default-topic: counter-events
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      linger: 10ms
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1
    consumer:
      group-id: counter-agg
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: latest
      enable-auto-commit: false
    listener:
      type: single
      ack-mode: manual
  ai:
    deepseek:
      api-key: sk-730ff81274394a6180f1adb0bb06f080
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.8
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key: 鍐欎綘鑷繁鐨?
    embedding:
      options:
        model: text-embedding-v4 # 鍚戦噺妯″瀷
        dimensions: 1536
    vectorstore:
      elasticsearch:
        initialize-schema: true
        index-name: zhiguang-ai-index
        dimensions: 1536 # 涓€瀹氳鍜屼笂闈㈢殑 dimensions 涓€鑷达紝涓嶇劧浼氭姤閿?

  elasticsearch:
    uris: http://localhost:9200


canal:
  enabled: true
  host: localhost
  port: 11111
  destination: example
  username: "canal"
  password: ${CANAL_PASSWORD}
  filter: zhicheng\.outbox
  batchSize: 1000
  intervalMs: 2000

counter:
  rebuild:
    enabled: false
    lock:
      ttl-ms: 5000
      watchdog-ms: 30000
    rate:
      permits: 3
      window-seconds: 10
    backoff:
      base-ms: 500
      max-ms: 30000

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

auth:
  jwt:
    issuer: zhiguang
    key-id: zhiguang-key
    private-key: classpath:keys/private.pem
    public-key: classpath:keys/public.pem
    access-token-ttl: PT15M
    refresh-token-ttl: P7D
  verification:
    code-length: 6
    ttl: PT5M
    max-attempts: 5
    send-interval: PT60S
    daily-limit: 10
  password:
    bcrypt-strength: 12
    min-length: 8


logging:
  level:
    root: INFO
    '[com.tongji]' : DEBUG

OSS:
  endpoint: oss-cn-beijing.aliyuncs.com
  access-key-id: ${OSS_ACCESS_KEY_ID}
  access-key-secret: ${OSS_ACCESS_KEY_SECRET}
  bucket: zhicheng-zzh
  public-domain: ${OSS_PUBLIC_DOMAIN:}
  folder: avatars

cache:
  12:
    public-cfg:
      ttl-seconds: 15
      max-size: 1000
      mine-cfg:
        ttl-seconds: 10
        max-size: 1000
    hotkey:
      window-seconds: 60
      segment-seconds: 10
      level-low: 50
      level-medium: 200
      level-high: 500
      extend-low-seconds: 20
      extend-medium-seconds: 60
      extend-high-seconds: 120
